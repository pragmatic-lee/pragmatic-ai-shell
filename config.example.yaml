# ============================================================
# smartcli 配置文件模板（v4）
# 使用方法: cp config.example.yaml config.yaml 后按需修改
# 说明: 启动时必须存在有效配置文件（默认当前目录 config.yaml，
#       或通过 smartcli --config <path> 指定），缺失将报错退出。
# ============================================================

version: 1                      # 配置版本，与程序支持版本比对（FR-15-03）

# ===== 启动行为 =====
shell:
  initialMode: smart            # 启动模式: smart（语义）| direct（直通），缺省 smart
  splash:
    enabled: true               # 启动界面总开关（FR-SPLASH）；非 TTY 自动降级为纯文本

# ===== LLM 后端（语义模式必填）=====
# 支持两种写法（二选一）：
#   A. 单模型（向后兼容）：直接写 provider/baseUrl/model/apiKey，自动合成 id=(inline)
#   B. 多模型：声明 defaultProfile + profiles 列表，启动激活默认项，运行中用 /model switch 切换
llm:
  provider: openai              # deepseek | openai | ollama
  baseUrl: https://api.openai.com/v1
  model: gpt-4o-mini
  temperature: 0.0              # 采样温度，取值 [0, 2]
  apiKey: sk-REPLACE_ME         # 语义模式必填；缺失时启动自动降级为直通模式
  timeoutSeconds: 60            # LLM 调用超时（秒），≥ 1
  showProgress: true            # 语义模式等待动画开关
  # --- 多模型写法（可选，取消注释即启用；启用后以上顶层单模型字段被忽略）---
  # defaultProfile: deep        # 缺省激活的 Profile id
  # profiles:                   # 每个 Profile 含 id/provider/baseUrl/model/temperature/apiKey/timeoutSeconds
  #   - id: deep
  #     provider: deepseek
  #     baseUrl: https://api.deepseek.com/v1
  #     model: deepseek-chat
  #     apiKey: sk-xxxx
  #     timeoutSeconds: 60
  #   - id: local
  #     provider: ollama
  #     baseUrl: http://localhost:11434
  #     model: qwen3:8b
  #     timeoutSeconds: 120
  context:                      # 多轮对话上下文（FR-CTX-07）：全局共享，不下沉到 Profile
    enabled: true               # 默认开启；false 时每次调用独立（v2 无上下文行为）
    maxTurns: 10                # 保留最近轮数，≥ 1
    maxResultChars: 2000        # 单轮命令执行结果摘要上限（字符），≥ 100

  profile:                      # 环境指纹（环境感知）
    enabled: true               # 默认开启；false 时不采集、不注入环境信息
    toolWhitelist: []           # 留空使用内置默认探测清单
    toolProbeTimeoutMs: 200     # 单工具探测超时（毫秒）

# ===== 命令执行 =====
execution:
  defaultTimeoutSeconds: 0      # 命令执行超时（秒）：0 = 不限时（挂死命令按 Ctrl+C 中断），> 0 = 超时强杀
  workDir: .                    # 默认工作目录（支持 ~ 展开，相对进程启动目录）
  readOnly: false               # 只读模式: true 时仅允许执行只读命令

# ===== 安全 =====
safety:
  strictMode: false             # 严格模式: 所有命令都需二次确认
  confirmDestructive: true      # 危险命令二次确认
  blockPrivateAddresses: true   # 拦截内网地址探测
  sudoPolicy: confirm           # sudo 命令处理: confirm=提权强确认后放行（默认）| reject=拒绝 | allow=放行
                                # 更严格可改 reject；高危命令（sudo rm -rf / 等）任何策略下都被拦截

# ===== 语义理解（LLM 职责边界）=====
nlu:
  executionJudgment: false      # false=LLM 只翻译，不判定能否执行，命令交由人确认（默认，宽松）
                                # true=LLM 可因"有风险/不可行"拒绝输出命令（严格）
  toolConstraint: reference     # reference=工具清单仅参考，不禁止未列出/未安装的工具（默认）
                                # strict=只能使用环境信息中已安装的工具
                                # 说明: OS 级约束（macOS 不用 apt / Linux 不用 brew）两档均保留请求

# ===== 日志 / 审计 =====
logging:
  auditEnabled: true            # 审计日志开关
  auditPath: ~/.smartcli/audit.log   # 审计日志路径（支持 ~ 展开，相对进程启动目录）
